[hooks]
colors_changed = "labwc -r"

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

[theme.templates]
builtin_ids = ["btop", "gtk3", "gtk4", "qt"]

[theme.templates.user.pyradio]
input_path = "~/.config/noctalia/PyRadio/mbcolors.pyradio-theme"
output_path = "~/.config/pyradio/themes/mbcolors.pyradio-theme"

[theme.templates.user.pywalfox]
input_path = "~/.config/noctalia/Pywalfox/colors.json"
output_path = "~/.cache/wal/colors.json"
post_hook = "pywalfox update"

[theme.templates.user.geany]
input_path = "~/.config/noctalia/Geany/noctalia.conf"
output_path = "~/.config/geany/colorschemes/noctalia.conf"

[theme.templates.user.labwc]
input_path = "~/.config/noctalia/templates/labwc.conf"
output_path = "~/.local/share/themes/noctalia/openbox-3/themerc"

[theme.templates.user.mabox-logo]
input_path = "~/.config/noctalia/templates/mabox-logo.svg"
output_path = "~/.local/share/mabox-noctalia-ce/mabox-logo.svg"

[theme.templates.user.mabox-logo-square]
input_path = "~/.config/noctalia/templates/mabox-logo-square.svg"
output_path = "~/.local/share/mabox-noctalia-ce/mabox-logo-square.svg"

[theme.templates.user.mabox-logo-3d]
input_path = "~/.config/noctalia/templates/mabox-logo-3d.svg"
output_path = "~/.local/share/mabox-noctalia-ce/mabox-logo-3d.svg"

[theme.templates.user.mabox-logo-ce]
input_path = "~/.config/noctalia/templates/mabox-logo-ce.svg"
output_path = "~/.local/share/mabox-noctalia-ce/mabox-logo-ce.svg"

[theme.templates.user.cava]
input_path = "~/.config/noctalia/templates/cava-palette"
output_path = "~/.cache/mabox-noctalia-ce/cava-palette"
post_hook = "mb-cava-theme"

[system.monitor]
enabled = true

[widget.sysmon-ram]
type = "sysmon"
stat = "ram"

[widget.screenrec]
type = "custom_button"
glyph = "camera"
color = "on_surface"
tooltip = "L:Area shot R:Panel"
capsule = false

[widget.screenrec.actions]
left = "exec mb-screenshot screenshot-region"
middle = "none"
right = "exec noctalia msg panel-toggle mabox/capture:main"

[widget.status]
type = "custom_button"
glyph = "activity"
color = "on_surface"
tooltip = "system status"

[widget.status.actions]
left = "exec noctalia msg panel-toggle mabox/status:main"
right = "exec noctalia msg panel-toggle mabox/status:pinned-left"
middle = "none"

[widget.colors]
type = "custom_button"
glyph = "color-picker"
color = "on_surface"
tooltip = "color picker"

[widget.colors.actions]
left = "exec noctalia msg panel-toggle mabox/colors:picker"

[widget.wallpaper_dirs]
type = "custom_button"
glyph = "photo"
color = "on_surface"
tooltip = "wallpaper folders"

[widget.wallpaper_dirs.actions]
left = "exec noctalia msg panel-toggle mabox/wallpaper-dirs:dirs"

[widget.updates]
type = "custom_button"
glyph = "circle-check"
color = "on_surface"
tooltip = "checking updates"
capsule = false

[widget.updates.actions]
left = "exec noctalia msg panel-toggle mabox/status:updates"
right = "exec noctalia msg panel-toggle mabox/status:main"
middle = "exec noctalia msg panel-toggle mabox/status:updates"

[widget.active_window]
colorize_icons = true

[widget.audio_visualizer]
bands = 49
capsule = false
centered = false
width = 163

[widget.bluetooth]
capsule = false

[widget.brightness]
capsule = false

[widget.clipboard]
capsule = false

[widget.clock]
anchor = true
capsule = true
capsule_radius = 3
color = "primary"
font_scale = 1.65
font_weight = 400
icon_color = "primary"
scale = 1.05
tooltip_format = "{:+%A %B %d}"

[widget.clock.actions]
right = "exec jumpapp -m rencal"

[widget.control-center]
capsule = false

[widget.cpu]
capsule = false
label_show_units = false
show_value = false

[widget.launcher]
show_tooltip = false

[widget.media]
artist_first = true
capsule = true
capsule_foreground = "primary"
capsule_radius = 3
hide_album_art = true
hide_when_idle = true
hide_when_no_media = true
max_length = 544
show_progress = true
show_tooltip = false

[widget.network]
capsule = false
show_label = false
vpn_status = "hidden"

[widget.network_rx]
capsule = false
network_speed_compact = true
show_value = false

[widget.session]
capsule = false

[widget.taskbar]
colorize_icons = true

[widget.tray]
capsule = false
capsule_fill = "on_primary"
capsule_padding = 0
capsule_radius = 3
colorize_icons = true
detached_panel = true
font_scale = 0.96
icon_type = "default"
match_adjacent_spacing = true
scale = 1.1
show_tooltip = true

[widget.volume]
capsule = false

[widget.wallpaper]
capsule = false

[widget.workspaces]
capsule = false
colorize_icons = true
empty_color = "primary"
focused_output_only = true
font_scale = 1.19
hide_when_empty = true
occupied_color = "primary"
scale = 1.2
show_icons = false
show_labels = false
show_tooltip = false
style = "focus_hint"

[widget.equalizer]
capsule = false
color = "on_surface"
glyph = "adjustments-horizontal"
type = "custom_button"
tooltip = "L:Panel M:Off R:On"

[widget.equalizer.actions]
left = "exec noctalia msg panel-toggle mabox/equalizer:main"
middle = "exec mb-eq off"
right = "exec mb-eq on"

[widget.notifications]
capsule = true
enabled = false

[shell]
app_icon_color = "primary"
panel_anchor_bar = "default"
polkit_agent = true
polkit_colorize_icons = true
popup_shadows = false
screen_time_colorize_icons = true

[shell.panel]
floating_layer = "top"
border_color = "primary"
border_width = 0.0
borders = false
shadow = false

[shell.window_switcher]
colorize_icons = true

[idle.behavior.screen_off]
action = "custom"
timeout = 450
command = "wlopm --off '*'"
resume_command = "wlopm --on '*'"

[bar.default]
center = []
end = ["audio_visualizer", "media", "equalizer", "cpu", "network_rx", "updates", "screenrec", "wallpaper_dirs", "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "brightness", "clock", "control-center", "session"]
border = "primary"
border_width = 1.0
color = "primary"
concave_edge_corners = false
icon_color = "primary"
margin_edge = 4
padding = 16
radius = 4
shadow = false
thickness = 45
widget_spacing = 7

[desktop_widgets]
enabled = true

[dock]
border = "primary"
colorize_icons = true
launcher_position = "start"
magnification = false
show_dots = true
smart_auto_hide = true

[notification]
colorize_icons = true

[wallpaper]
directory = "/usr/share/backgrounds"
