[hooks]
colors_changed = "labwc -r"

[theme.templates.user.pyradio]
input_path = "~/.config/noctalia/PyRadio/mbcolors.pyradio-theme"
output_path = "~/.config/pyradio/themes/mbcolors.pyradio-theme"

[theme.templates.user.pywalfox]
input_path = "~/.config/noctalia/Pywalfox/colors.json"
output_path = "~/.cache/wal/colors.json"
post_hook = "pywalfox update"

[theme.templates.user.conky]
input_path = "~/.config/noctalia/Conky/colors.lua"
output_path = "~/.config/mabox-noctalia-ce/conky/colors.lua"
post_hook = "sh -c '~/.config/mabox-noctalia-ce/menuscripts/conky-start'"

[theme.templates.user.geany]
input_path = "~/.config/noctalia/Geany/noctalia.conf"
output_path = "~/.config/geany/colorschemes/noctalia.conf"

[theme.templates.user.labwc]
input_path = "~/.config/noctalia/templates/labwc.conf"
output_path = "~/.local/share/themes/noctalia/openbox-3/themerc"

[theme.templates.user.jgmenu]
input_path = "~/.config/noctalia/templates/jgmenu.conf"
output_path = "~/.config/mabox-noctalia-ce/jgmenurc"

[system.monitor]
enabled = true

[widget.sysmon-ram]
type = "sysmon"
stat = "ram"

[idle.behavior.screen_off]
  action = "custom"
  timeout = 450
  command = "wlopm --off '*'"
  resume_command = "wlopm --on '*'"

[bar.default]
end = ['media', 'sysmon-ram', 'updates', 'colors', 'screenrec', 'tray', 'notifications', 'clipboard', 'network', 'bluetooth', 'volume', 'brightness', 'battery', 'control-center', 'session']

[widget.screenrec]
type = "custom_button"
glyph = "player-record"
color = "on_surface"
tooltip = "start recording"

[widget.screenrec.actions]
left = "exec screenrec-toggle"

[widget.colors]
type = "custom_button"
glyph = "color-picker"
color = "on_surface"
tooltip = "color picker"

[widget.colors.actions]
left = "exec noctalia msg panel-toggle musqz/colors:picker"

[widget.updates]
type = "custom_button"
glyph = "circle-check"
color = "on_surface"
tooltip = "checking updates"

[widget.updates.actions]
left = "exec mb-updates-ce menu"
right = "exec mb-updates-ce check"
