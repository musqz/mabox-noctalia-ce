# window border
window.active.border.color: {{colors.primary.default.hex}}
window.inactive.border.color: {{colors.outline.default.hex}}

# window titlebar background (elevated surface, not the accent hue)
window.active.title.bg.color: {{colors.surface_container_highest.default.hex}}
window.active.title.bg.colorTo: {{colors.surface_container_low.default.hex}}
window.inactive.title.bg.color: {{colors.surface_container_highest.default.hex}}
window.inactive.title.bg.colorTo: {{colors.surface_container_highest.default.hex}}

window.active.label.text.color: {{colors.on_surface.default.hex}}
window.inactive.label.text.color: {{colors.on_surface_variant.default.hex}}

# window buttons
window.active.button.unpressed.image.color: {{colors.on_surface_variant.default.hex}}
window.active.button.hover.image.color: {{colors.on_surface_variant.default.hex}}
window.button.hover.bg.color: #80808020
window.button.hover.bg.corner-radius: 12
window.active.button.pressed.image.color: {{colors.primary.default.hex}}
window.inactive.button.unpressed.image.color: {{colors.on_surface_variant.default.hex}}
window.inactive.button.hover.image.color: {{colors.on_surface_variant.default.hex}}
window.inactive.button.pressed.image.color: {{colors.on_surface_variant.default.hex}}

# window button width and spacing
window.button.width: 24
window.button.height: 24
window.button.spacing: 20

# menu
menu.border.width: 2
menu.border.color: {{colors.primary.default.hex}}
menu.items.bg.color: {{colors.surface_container_high.default.hex}}
menu.items.text.color: {{colors.on_surface.default.hex}}
menu.items.active.bg.color: {{colors.primary.default.hex}}
menu.items.active.text.color: {{colors.on_primary.default.hex}}
menu.separator.color: {{colors.outline_variant.default.hex}}
menu.title.bg.color: {{colors.surface_container_high.default.hex}}
menu.title.text.color: {{colors.on_surface.default.hex}}

# on screen display (window-cycle dialog)
osd.bg.color: {{colors.surface_container_high.default.hex}}
osd.border.color: {{colors.outline.default.hex}}
osd.label.text.color: {{colors.on_surface.default.hex}}
osd.window-switcher.preview.border.color: {{colors.outline.default.hex}}


# Default values for following options change depending on the rendering
# backend. For software-based renderers, *.bg.enabled is "no" and
# *.border.enabled is "yes" if not set. For hardware-based renderers,
# *.bg.enabled is "yes" and *.border.enabled is "no" if not set.
# Setting *.bg.enabled to "yes" for software-based renderer with translucent
# background color may severely impact performance.
#
# snapping.overlay.region.bg.enabled:
# snapping.overlay.edge.bg.enabled:
# snapping.overlay.region.border.enabled:
# snapping.overlay.edge.border.enabled:

snapping.overlay.region.bg.color: {{colors.surface_container_high.default.hex}}80
snapping.overlay.edge.bg.color: {{colors.surface_container_high.default.hex}}80
snapping.overlay.region.border.width: 4
snapping.overlay.edge.border.width: 4
snapping.overlay.region.border.color: #dddda6,#000000,#dddda6
snapping.overlay.edge.border.color: #dddda6,#000000,#dddda6


<* for name, value in colors *>
{{ name }}={{ value.default.hex }}
<* endfor *>
