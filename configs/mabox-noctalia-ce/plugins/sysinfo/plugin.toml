id = "mabox/sysinfo"
name = "Sysinfo"
version = "0.1.0"
plugin_api = 43
author = "mabox"
license = "MIT"
icon = "chart-line"
description = "Desktop widget with date, system info, CPU and RAM graphs, top processes and disc usage."
tags = ["desktop", "system"]

[[desktop_widget]]
id = "sysinfo"
entry = "widget.luau"

  [[desktop_widget.setting]]
  key = "size"
  type = "int"
  label_key = "settings.size.label"
  description_key = "settings.size.description"
  default = 100
  min = 50
  max = 200
