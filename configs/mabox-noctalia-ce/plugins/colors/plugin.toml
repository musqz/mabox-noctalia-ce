id = "mabox/colors"
name = "Colors"
version = "0.1.0"
plugin_api = 43
author = "mabox"
license = "MIT"
icon = "color-picker"
description = "Color picker panel: pick from screen, recent colors and palettes; click a swatch to copy it."
dependencies = ["grim", "slurp"]
tags = ["utility", "colors"]

[[panel]]
id = "picker"
entry = "panel.luau"
width = 760
height = "content"
max_height = 600
placement = "attached"
open_near_click = true
capture_keys = ["alt+up", "alt+down", "alt+left", "alt+right", "alt+shift+up", "alt+shift+down", "alt+enter", "alt+s", "alt+q"]

[[service]]
id = "pin"
entry = "pin.luau"

[[layer]]
id = "pinned-left"
entry = "pinned-left.luau"
layer = "top"
anchors = ["left", "top", "bottom"]
width = 330
margins = { top = 10, bottom = 10, left = 10 }
keyboard = "on_demand"
output = "focused"

[[layer]]
id = "pinned-right"
entry = "pinned-right.luau"
layer = "top"
anchors = ["right", "top", "bottom"]
width = 330
margins = { top = 10, bottom = 10, right = 10 }
keyboard = "on_demand"
output = "focused"
