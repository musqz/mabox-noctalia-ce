id = "mabox/colors"
name = "Colors"
version = "0.1.0"
plugin_api = 43
author = "mabox"
license = "MIT"
icon = "color-picker"
description = "Color picker panel: pick from screen, recent colors and palettes; click a swatch to copy it."
dependencies = ["grim", "slurp"]
tags = ["utility", "colors"]

[[panel]]
id = "picker"
entry = "panel.luau"
width = 760
height = "content"
max_height = 600
placement = "attached"
open_near_click = true
capture_keys = ["alt+up", "alt+down", "alt+left", "alt+right", "alt+shift+up", "alt+shift+down", "alt+enter", "alt+s"]

[[panel]]
id = "pinned-left"
entry = "pinned-left.luau"
width = 330
height = "fill"
placement = "floating"
position = "top_left"
persistent = true
dismiss_on_outside_click = false
keyboard_focus = "on_demand"
capture_keys = ["alt+up", "alt+down", "alt+left", "alt+right", "alt+shift+up", "alt+shift+down", "alt+enter", "alt+s"]
layer = "overlay"

[[panel]]
id = "pinned-right"
entry = "pinned-right.luau"
width = 330
height = "fill"
placement = "floating"
position = "top_right"
persistent = true
dismiss_on_outside_click = false
keyboard_focus = "on_demand"
capture_keys = ["alt+up", "alt+down", "alt+left", "alt+right", "alt+shift+up", "alt+shift+down", "alt+enter", "alt+s"]
layer = "overlay"
