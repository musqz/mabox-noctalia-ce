id = "mabox/status"
name = "Status"
version = "0.1.0"
plugin_api = 43
author = "mabox"
license = "MIT"
icon = "activity"
description = "System status: packages, discs, and cleanup rows for journal, caches, orphans, trash and containers. Cleanup runs in a terminal after a dry run and a confirmation."
tags = ["utility", "system"]

[[panel]]
id = "main"
entry = "panel.luau"
width = 420
height = "content"
max_height = 640
placement = "attached"
open_near_click = true
capture_keys = ["alt+up", "alt+down", "alt+left", "alt+right", "alt+shift+up", "alt+shift+down", "alt+enter", "alt+s", "alt+q"]

[[panel]]
id = "updates"
entry = "updates.luau"
width = 300
height = "content"
max_height = 480
placement = "attached"
open_near_click = true

[[service]]
id = "pin"
entry = "pin.luau"

[[layer]]
id = "pinned-left"
entry = "pinned-left.luau"
layer = "overlay"
anchors = ["left", "top", "bottom"]
width = 330
margins = { top = 4, bottom = 4 }
keyboard = "on_demand"
output = "focused"

[[layer]]
id = "pinned-right"
entry = "pinned-right.luau"
layer = "overlay"
anchors = ["right", "top", "bottom"]
width = 330
margins = { top = 4, bottom = 4 }
keyboard = "on_demand"
output = "focused"
