id = "mabox/music"
name = "Music"
version = "0.1.0"
plugin_api = 43
author = "mabox"
license = "MIT"
icon = "music"
description = "Play and shuffle the mb-music CSV list through mpv; controls via the MPRIS media widget."
dependencies = ["mpv", "socat", "yt-dlp", "mpv-mpris", "playerctl"]
tags = ["launcher", "audio", "music"]

[[launcher_provider]]
id = "finder"
entry = "finder.luau"
prefix = "music"
glyph = "music"
include_in_global_search = false

[[panel]]
id = "add"
entry = "add.luau"
width = 520
height = "content"
max_height = 420
placement = "attached"
open_near_click = true

[[panel]]
id = "player"
entry = "player.luau"
width = 1200
height = "content"
max_height = 620
placement = "floating"
position = "top_center"
keyboard_focus = "on_demand"

[[panel]]
id = "player-keep"
entry = "player-keep.luau"
width = 1200
height = 620
placement = "floating"
position = "top_center"
keyboard_focus = "on_demand"
persistent = true
dismiss_on_outside_click = false
