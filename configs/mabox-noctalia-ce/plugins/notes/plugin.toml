id = "mabox/notes"
name = "Notes"
version = "0.1.0"
plugin_api = 43
author = "mabox"
license = "MIT"
icon = "notes"
description = "Quick notes with colors: search by keyword, #tag or date, filter by color, copy. Plain files, so the folder can be synced."
tags = ["utility", "notes"]

[[panel]]
id = "main"
entry = "panel.luau"
width = 760
height = "content"
max_height = 600
placement = "attached"
open_near_click = true
capture_keys = ["alt+up", "alt+down", "alt+left", "alt+right", "alt+enter", "alt+c", "alt+e", "alt+s", "alt+q"]

[[service]]
id = "pin"
entry = "pin.luau"

[[layer]]
id = "pinned-left"
entry = "pinned-left.luau"
layer = "overlay"
anchors = ["left", "top", "bottom"]
width = 330
margins = { top = 20, bottom = 20 }
keyboard = "on_demand"
output = "focused"

[[layer]]
id = "pinned-right"
entry = "pinned-right.luau"
layer = "overlay"
anchors = ["right", "top", "bottom"]
width = 330
margins = { top = 20, bottom = 20 }
keyboard = "on_demand"
output = "focused"
