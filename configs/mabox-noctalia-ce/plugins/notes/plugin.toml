id = "mabox/notes"
name = "Notes"
version = "0.1.0"
plugin_api = 43
author = "mabox"
license = "MIT"
icon = "notes"
description = "Quick notes with colors: search by keyword, #tag or date, filter by color, copy. Plain files, so the folder can be synced."
tags = ["utility", "notes"]

[[panel]]
id = "main"
entry = "panel.luau"
width = 760
height = "content"
max_height = 600
placement = "attached"
open_near_click = true
capture_keys = ["alt+up", "alt+down", "alt+left", "alt+right", "alt+enter", "alt+c", "alt+e", "alt+s"]

[[panel]]
id = "pinned"
entry = "pinned.luau"
width = 330
height = "fill"
placement = "floating"
position = "top_left"
persistent = true
dismiss_on_outside_click = false
keyboard_focus = "on_demand"
capture_keys = ["alt+up", "alt+down", "alt+left", "alt+right", "alt+enter", "alt+c", "alt+e", "alt+s"]
layer = "overlay"
