id = "mabox/info"
name = "Info"
version = "0.1.0"
plugin_api = 43
author = "mabox"
license = "MIT"
icon = "info-circle"
description = "Desktop widget with the Mabox logo, an About line and the basic hotkeys."
tags = ["desktop"]

[[desktop_widget]]
id = "info"
entry = "info.luau"

  [[desktop_widget.setting]]
  key = "size"
  type = "int"
  label_key = "settings.size.label"
  description_key = "settings.size.description"
  default = 100
  min = 50
  max = 200

  [[desktop_widget.setting]]
  key = "radius"
  type = "int"
  label_key = "settings.radius.label"
  description_key = "settings.radius.description"
  default = 8
  min = 0
  max = 32
