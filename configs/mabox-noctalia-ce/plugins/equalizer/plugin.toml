id = "mabox/equalizer"
name = "Equalizer"
version = "0.1.0"
plugin_api = 43
author = "mabox"
license = "MIT"
icon = "adjustments-horizontal"
description = "10-band equalizer with preamp on a PipeWire filter-chain sink (mb-eq); changes apply live."
tags = ["utility", "audio"]

[[panel]]
id = "main"
entry = "panel.luau"
width = 780
height = "content"
max_height = 620
placement = "floating"
position = "top_center"
keyboard_focus = "on_demand"

[[panel]]
id = "main-keep"
entry = "panel-keep.luau"
width = 780
height = 620
placement = "floating"
position = "top_center"
keyboard_focus = "on_demand"
persistent = true
dismiss_on_outside_click = false

[[service]]
id = "restore"
entry = "service.luau"
