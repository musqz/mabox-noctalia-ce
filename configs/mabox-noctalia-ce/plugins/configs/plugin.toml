id = "mabox/configs"
name = "Configs"
version = "0.1.0"
plugin_api = 43
author = "mabox"
license = "MIT"
icon = "file-settings"
description = "Overview of the config files of this session; entries show up when the tool is installed. Add your own files in the Custom section."
tags = ["utility", "system"]

[[panel]]
id = "main"
entry = "panel.luau"
width = 420
height = "content"
max_height = 560
placement = "attached"
open_near_click = true
capture_keys = ["alt+up", "alt+down", "alt+left", "alt+right", "alt+shift+up", "alt+shift+down", "alt+enter", "alt+s", "alt+q"]

[[service]]
id = "pin"
entry = "pin.luau"

[[layer]]
id = "pinned-left"
entry = "pinned-left.luau"
layer = "top"
anchors = ["left", "top", "bottom"]
width = 330
keyboard = "on_demand"
output = "focused"

[[layer]]
id = "pinned-right"
entry = "pinned-right.luau"
layer = "top"
anchors = ["right", "top", "bottom"]
width = 330
keyboard = "on_demand"
output = "focused"
