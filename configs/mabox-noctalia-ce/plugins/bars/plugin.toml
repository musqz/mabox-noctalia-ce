id = "mabox/bars"
name = "Bars"
version = "0.1.0"
plugin_api = 43
author = "mabox"
license = "MIT"
icon = "layout-navbar"
description = "Bar looks and profiles: change the shape of the bar, save the bars by name with a picture, switch, undo. /bars in the launcher opens it."
tags = ["utility", "system"]

[[panel]]
id = "main"
entry = "panel.luau"
width = 1260
height = "content"
max_height = 620
placement = "floating"
position = "top_center"
keyboard_focus = "on_demand"

[[launcher_provider]]
id = "finder"
entry = "finder.luau"
prefix = "bars"
glyph = "layout-navbar"
include_in_global_search = false
