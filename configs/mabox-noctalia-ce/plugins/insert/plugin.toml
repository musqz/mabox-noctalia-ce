id = "mabox/insert"
name = "Insert"
version = "0.1.0"
plugin_api = 43
author = "mabox"
license = "MIT"
icon = "keyboard"
description = "Type a shell history line (/hist) or an Espanso snippet (/es) into the previous window with wtype; a panel adds and edits your snippets."
dependencies = ["wtype"]
tags = ["launcher", "utility"]

[[launcher_provider]]
id = "hist"
entry = "hist.luau"
prefix = "hist"
glyph = "history"
include_in_global_search = false

[[launcher_provider]]
id = "espanso"
entry = "espanso.luau"
prefix = "es"
glyph = "text-plus"
include_in_global_search = false

[[panel]]
id = "snippets"
entry = "snippets.luau"
width = 520
height = "content"
max_height = 520
placement = "floating"
position = "top_center"
keyboard_focus = "on_demand"
capture_keys = ["alt+up", "alt+down", "alt+left", "alt+right", "alt+shift+up", "alt+shift+down", "alt+enter", "alt+s", "alt+q"]
