id = "mabox/recolor"
name = "Recolor"
version = "0.1.0"
plugin_api = 43
author = "mabox"
license = "MIT"
icon = "color-swatch"
description = "Recolor an image or a folder of images to a palette (Nord, Gruvbox, Catppuccin Mocha, Dracula, Solarized) with mb-recolor."
dependencies = ["yad"]
tags = ["utility", "graphics"]

[[panel]]
id = "main"
entry = "panel.luau"
width = 1200
height = "content"
max_height = 1100
placement = "floating"
position = "top_center"

[[panel]]
id = "wallgen"
entry = "wallgen.luau"
width = 1840
height = "content"
max_height = 1100
placement = "floating"
position = "top_center"

[[panel]]
id = "wallgen-compact"
entry = "wallgen-compact.luau"
width = 1260
height = "content"
max_height = 760
placement = "floating"
position = "top_center"
