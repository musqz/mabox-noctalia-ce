id = "mabox/keys"
name = "Keys"
version = "0.1.0"
plugin_api = 43
author = "mabox"
license = "MIT"
icon = "keyboard"
description = "Hotkey list of the labwc session: grouped, searchable, click a row to try the key's action; /keys in the launcher searches and runs them."
tags = ["utility", "system"]

[[panel]]
id = "keys"
entry = "panel.luau"
width = 700
height = "content"
max_height = 620
placement = "floating"
position = "top_center"
keyboard_focus = "on_demand"
capture_keys = ["alt+up", "alt+down", "alt+left", "alt+right", "alt+shift+up", "alt+shift+down", "alt+enter", "alt+s"]

[[panel]]
id = "keys-wide"
entry = "wide.luau"
width = "fill"
height = "content"
max_height = 620
placement = "floating"
position = "top_center"
keyboard_focus = "on_demand"
capture_keys = ["alt+up", "alt+down", "alt+left", "alt+right", "alt+shift+up", "alt+shift+down", "alt+enter", "alt+s"]

[[launcher_provider]]
id = "finder"
entry = "finder.luau"
prefix = "keys"
glyph = "keyboard"
include_in_global_search = false
