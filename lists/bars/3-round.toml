border_width = 0.0
shadow = false
contact_shadow = false
compositor_blur = false
concave_edge_corners = false
radius = 10
radius_top_left = 10
radius_top_right = 10
radius_bottom_left = 10
radius_bottom_right = 10
margin_ends = 100
margin_edge = 4
thickness = 45
padding = 16
widget_spacing = 6
capsule = true
